<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="sketch.js"></script>
</head>
<body>
    <div class="etchASketch" width="650" height="650">
        <div class="circleHandle left"></div>
        <div class="squaresContainer"></div>
        <div class="circleHandle right"></div>
    </div>
    <h1 class="title">Etch A Sketch Online</h1>
    <div class="buttons">
        <button id="gridSizeButton">Change Grid Size</button>
        <button id="timeOutButton">Change Fade Time</button>
        <button id="toggleHoldButton">Toggle Hold to Draw</button>
        <button id="toggleRainbowButton">Toggle Rainbow</button>
        <button id="toggleOpacityButton">Toggle Opacity</button>
        <button id="toggleGridButton">Toggle Grid Lines</button>
    </div>
    
</body>
</html>
